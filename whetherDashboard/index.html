<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Whether Dashboard</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="d-flex">
        <nav class="sidebar">
            <h4 class="sidebar-title">🌤️ SkyCast</h4>
            <p class="sidebar-subtitle">Real-time Weather Insights</p>

            <!-- Search  -->
            <div class="search-box">
                <input type="text" placeholder="Search City" id="city-input">
                <span class="search-btn">🔍</span>
            </div>

            <!-- Recent Items -->
            <div class="recent-section">
                <div class="d-flex justify-content-between align-items-center mb-2">
                    <p class="m-0 fw-bold">🕐 Recent Searches</p>
                    <span id="delete-history" class="delete-icon">🗑</span>
                </div>
                <ul class="list-group recent-list">
                    <li class="list-group-item recent-item">
                        <span>Mumbai</span>
                        <span class="item-delete">✖</span>
                    </li>
                    <li class="list-group-item recent-item">
                        <span>Pune</span>
                        <span class="item-delete">✖</span>
                    </li>
                    <li class="list-group-item recent-item">
                        <span>Delhi</span>
                        <span class="item-delete">✖</span>
                    </li>
                </ul>
            </div>
        </nav>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="script.js"></script>
</body>
</html>
