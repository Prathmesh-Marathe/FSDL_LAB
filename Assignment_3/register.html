<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Signup | ShopKart</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
</head>
<body class="bw-theme">

<div class="container d-flex justify-content-center align-items-center min-vh-100">

    <div class="card p-4 shadow" style="max-width:420px;width:100%;">
        <h3 class="text-center mb-3">Create Account</h3>

        <form id="registrationForm">

            <input type="text" id="username" class="form-control mb-2" placeholder="Username">
            <input type="email" id="email" class="form-control mb-2" placeholder="Email">
            <input type="password" id="password" class="form-control mb-2" placeholder="Password">

            <select id="country" class="form-select mb-2">
                <option value="">Select Country</option>
                <option>India</option>
                <option>USA</option>
                <option>UK</option>
            </select>

            <input type="text" id="zip" class="form-control mb-2" placeholder="Zip Code">

            <textarea id="address" class="form-control mb-2" placeholder="Address"></textarea>

            <div class="mb-2">
                <input type="radio" name="gender" value="Male"> Male
                <input type="radio" name="gender" value="Female" class="ms-3"> Female
            </div>

            <div class="form-check mb-3">
                <input type="checkbox" id="terms" class="form-check-input">
                <label class="form-check-label">Accept Terms</label>
            </div>

            <button class="btn btn-dark w-100">Sign Up</button>
        </form>

        <p class="text-center mt-3">
            Already registered?
            <a href="login.html">Login</a>
        </p>
    </div>
</div>

<script src="js/register.js"></script>
</body>
</html>
